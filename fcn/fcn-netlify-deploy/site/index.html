<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo } = React;

// ---------- tiny inline icon glyphs (no external icon package needed) ----------
const Ico = ({ children, size = 16, className = "" }) => (
  <span className={className} style={{ fontSize: size, lineHeight: 1, display: "inline-block" }}>{children}</span>
);
const IPlus = (p) => <Ico {...p}>＋</Ico>;
const ITrash = (p) => <Ico {...p}>🗑</Ico>;
const IRefresh = (p) => <Ico {...p} className={`${p.className||""} inline-block`}>↻</Ico>;
const IChevDown = (p) => <Ico {...p}>▾</Ico>;
const IChevUp = (p) => <Ico {...p}>▴</Ico>;
const IWarn = (p) => <Ico {...p}>⚠</Ico>;
const ICheck = (p) => <Ico {...p}>✓</Ico>;
const IX2 = (p) => <Ico {...p}>✕</Ico>;
const IClock = (p) => <Ico {...p}>◷</Ico>;
const IPencil = (p) => <Ico {...p}>✎</Ico>;
const IDownload = (p) => <Ico {...p}>⭳</Ico>;
const IUpload = (p) => <Ico {...p}>⭱</Ico>;
const IHome = (p) => <Ico {...p}>⌂</Ico>;
const IUsers = (p) => <Ico {...p}>♙</Ico>;
const IArchive = (p) => <Ico {...p}>▣</Ico>;

// ---------- date helpers ----------
const toISO = (d) => {
  const dt = d instanceof Date ? d : new Date(d);
  return [dt.getFullYear(), String(dt.getMonth() + 1).padStart(2, "0"), String(dt.getDate()).padStart(2, "0")].join("-");
};
const newYorkTodayISO = () => {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(new Date());
  const get = (type) => parts.find((part) => part.type === type)?.value;
  return `${get("year")}-${get("month")}-${get("day")}`;
};
const todayISO = () => newYorkTodayISO();
function zonedClock(timeZone) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone, year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  }).formatToParts(new Date());
  const get = (type) => parts.find((part) => part.type === type)?.value || "0";
  return { date: `${get("year")}-${get("month")}-${get("day")}`, minutes: Number(get("hour")) * 60 + Number(get("minute")) };
}
function marketRuleForSymbol(rawSymbol) {
  const symbol = normalizeSymbol(rawSymbol);
  if (/\.T$/.test(symbol)) return { name: "東京", timeZone: "Asia/Tokyo", closeMinutes: 15 * 60 + 45 };
  if (/\.AX$/.test(symbol)) return { name: "澳洲", timeZone: "Australia/Sydney", closeMinutes: 16 * 60 + 20 };
  if (/\.HK$/.test(symbol)) return { name: "香港", timeZone: "Asia/Hong_Kong", closeMinutes: 16 * 60 + 15 };
  if (/\.(TW|TWO)$/.test(symbol)) return { name: "台灣", timeZone: "Asia/Taipei", closeMinutes: 13 * 60 + 45 };
  if (/\.SI$/.test(symbol)) return { name: "新加坡", timeZone: "Asia/Singapore", closeMinutes: 17 * 60 + 15 };
  if (/\.(KS|KQ)$/.test(symbol)) return { name: "韓國", timeZone: "Asia/Seoul", closeMinutes: 15 * 60 + 45 };
  if (/\.(NS|BO)$/.test(symbol)) return { name: "印度", timeZone: "Asia/Kolkata", closeMinutes: 15 * 60 + 45 };
  if (/\.L$/.test(symbol)) return { name: "倫敦", timeZone: "Europe/London", closeMinutes: 16 * 60 + 45 };
  if (/\.(PA|AS|BR)$/.test(symbol)) return { name: "歐洲", timeZone: "Europe/Paris", closeMinutes: 17 * 60 + 45 };
  if (/\.(DE|F)$/.test(symbol)) return { name: "德國", timeZone: "Europe/Berlin", closeMinutes: 17 * 60 + 45 };
  if (/\.SW$/.test(symbol)) return { name: "瑞士", timeZone: "Europe/Zurich", closeMinutes: 17 * 60 + 45 };
  if (/\.(TO|V)$/.test(symbol)) return { name: "加拿大", timeZone: "America/Toronto", closeMinutes: 16 * 60 + 15 };
  return { name: "美國", timeZone: "America/New_York", closeMinutes: 16 * 60 + 15 };
}
function isMarketCloseReadyForSymbol(symbol, date, asOfDate = todayISO()) {
  if (asOfDate !== todayISO()) return date <= asOfDate;
  const rule = marketRuleForSymbol(symbol);
  const clock = zonedClock(rule.timeZone);
  if (date < clock.date) return true;
  if (date > clock.date) return false;
  return clock.minutes >= rule.closeMinutes;
}
function productMarketsCloseReady(p, date, asOfDate = todayISO()) {
  const underlyings = p.underlyings || [];
  return underlyings.length > 0 && underlyings.every((u) => isMarketCloseReadyForSymbol(u.symbol, date, asOfDate));
}
const addMonths = (dateStr, n) => {
  const d = new Date(dateStr + "T00:00:00");
  d.setMonth(d.getMonth() + n);
  return toISO(d);
};
const daysBetween = (a, b) => {
  const A = new Date(a + "T00:00:00");
  const B = new Date(b + "T00:00:00");
  return Math.round((B - A) / 86400000);
};
const fmtDate = (s) => {
  if (!s) return "—";
  const [y, m, d] = s.split("-");
  return `${y}/${m}/${d}`;
};
const fmtPrice = (value) => Number.isFinite(Number(value))
  ? Number(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
  : "—";

// ---------- storage (plain localStorage — this runs as an independent hosted app) ----------
const PRODUCTS_KEY = "fcn:products";
const PRICES_KEY = "fcn:prices";
const CUSTOMERS_KEY = "fcn:customers";
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error(e); }
}

// ---------- price fetching ----------
// US stock symbols such as TSLA are normalized here. The app tries several
// public quote routes because a browser-hosted HTML page cannot reliably call
// every market-data host directly due to CORS restrictions.
function normalizeSymbol(rawSymbol) {
  let s = String(rawSymbol || '').trim().toUpperCase().replace(/\s+/g, '');
  // Accept TSLA, TSLA.US, NASDAQ:TSLA, NYSE:XYZ, etc.
  s = s.replace(/^NASDAQ:/, '').replace(/^NYSE:/, '').replace(/^AMEX:/, '');
  // Tokyo Stock Exchange convenience formats: 8035, 8035JT, 8035.JP -> 8035.T.
  if (/^\d{4}\.?((JT)|(JP))$/.test(s)) s = s.slice(0, 4) + ".T";
  else if (/^\d{4}$/.test(s)) s += ".T";
  else if (/^\d{4}\.JP$/.test(s)) s = s.slice(0, 4) + ".T";
  return s;
}

function yahooSymbol(rawSymbol) {
  const s = normalizeSymbol(rawSymbol);
  return s.includes('.') ? s : s;
}

async function fetchJson(url, timeoutMs = 12000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally { clearTimeout(timer); }
}

async function fetchYahooPrice(rawSymbol) {
  const symbol = yahooSymbol(rawSymbol);
  const target = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=5d&interval=1d&includePrePost=true`;
  // Yahoo uses more than one hostname. Trying both avoids a single regional
  // endpoint or a temporary CORS failure making a common code such as TSLA fail.
  const mirror = target.replace("query1.finance.yahoo.com", "query2.finance.yahoo.com");
  const urls = [
    target, mirror,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,
    `https://corsproxy.io/?url=${encodeURIComponent(target)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}`
  ];
  let lastErr;
  for (const url of urls) {
    try {
      const data = await fetchJson(url);
      const result = data?.chart?.result?.[0];
      const meta = result?.meta;
      const closes = result?.indicators?.quote?.[0]?.close || [];
      const validCloses = closes.filter((v) => Number.isFinite(Number(v)) && Number(v) > 0).map(Number);
      // Use the first positive quote. `??` alone is not enough because a provider
      // can return 0 for an unavailable regular-market quote.
      const candidates = [meta?.regularMarketPrice, meta?.postMarketPrice, meta?.preMarketPrice, validCloses.at(-1)];
      const price = candidates.map(Number).find((value) => Number.isFinite(value) && value > 0);
      if (Number.isFinite(price) && price > 0) return price;
      throw new Error('Yahoo: no price');
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Yahoo unavailable');
}

// Nasdaq is an independent source for plain US symbols (TSLA, NVDA, AAPL...).
// It is deliberately before Stooq because Stooq's latest close can be delayed.
function parseNasdaqPrice(value) {
  const cleaned = String(value ?? "").replace(/[^0-9.\-]/g, "");
  const price = Number(cleaned);
  return Number.isFinite(price) && price > 0 ? price : null;
}
async function fetchNasdaqPrice(rawSymbol) {
  const symbol = normalizeSymbol(rawSymbol);
  // Nasdaq only accepts a simple US ticker; foreign-market suffixes continue to
  // the Yahoo/Stooq fallbacks below.
  if (!/^[A-Z.\-]+$/.test(symbol) || symbol.includes(".")) throw new Error("Nasdaq: unsupported symbol");
  const target = `https://api.nasdaq.com/api/quote/${encodeURIComponent(symbol)}/info?assetclass=stocks`;
  const urls = [
    target,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,
    `https://corsproxy.io/?url=${encodeURIComponent(target)}`
  ];
  let lastErr;
  for (const url of urls) {
    try {
      const data = await fetchJson(url);
      const price = parseNasdaqPrice(data?.data?.primaryData?.lastSalePrice);
      if (price) return price;
      throw new Error("Nasdaq: no price");
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("Nasdaq unavailable");
}

async function fetchStooqPrice(rawSymbol) {
  const s = normalizeSymbol(rawSymbol);
  const candidates = s.includes('.') ? [s.toLowerCase()] : [s.toLowerCase(), `${s.toLowerCase()}.us`];
  let lastErr;
  for (const cand of candidates) {
    const target = `https://stooq.com/q/l/?s=${encodeURIComponent(cand)}&f=sd2t2ohlcv&h&e=csv`;
    const urls = [
      target,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`,
      `https://corsproxy.io/?url=${encodeURIComponent(target)}`,
      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}`
    ];
    for (const url of urls) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        try {
          const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          const lines = text.trim().split(/\r?\n/);
          if (lines.length < 2) throw new Error('Stooq: no data');
          const row = lines[1].split(',');
          // f=sd2t2ohlcv => symbol,date,time,open,high,low,close,volume
          const price = Number(row[6]);
          if (!Number.isFinite(price) || price <= 0) throw new Error('Stooq: no close');
          return price;
        } finally { clearTimeout(timer); }
      } catch (e) { lastErr = e; }
    }
  }
  throw lastErr || new Error('Stooq unavailable');
}

// On Netlify, use our same-origin serverless function first. It fetches Yahoo
// from the server, so iPhone/Safari CORS rules and public proxy outages cannot
// prevent normal tickers such as TSLA, AAL and TSM.US from updating.
async function fetchNetlifyPrice(rawSymbol, start) {
  const symbol = normalizeSymbol(rawSymbol);
  const startParam = /^\d{4}-\d{2}-\d{2}$/.test(start || "") ? `&start=${encodeURIComponent(start)}` : "";
  const data = await fetchJson(`/.netlify/functions/quote?symbol=${encodeURIComponent(symbol)}${startParam}`, 15000);
  const price = Number(data?.price);
  if (!Number.isFinite(price) || price <= 0) throw new Error('Netlify: no price');
  return {
    price, date: data?.date || null,
    history: Array.isArray(data?.history) ? data.history : [],
    splits: Array.isArray(data?.splits) ? data.splits : [],
    closeVerification: data?.closeVerification || null,
  };
}

async function fetchLivePrice(rawSymbol, startDate) {
  const s = normalizeSymbol(rawSymbol);
  if (!s) throw new Error('empty symbol');
  // Only the server function returns dated daily-close history. Browser quote
  // fallbacks can expose an intraday last trade, which must never trigger KO.
  return await fetchNetlifyPrice(s, startDate);
}

// ---------- product model helpers ----------
function maturityOf(p) {
  if (p.finalValuationDate) return p.finalValuationDate;
  return addMonths(p.tradeDate || p.issueDate || newYorkTodayISO(), Number(p.tenorMonths || 0));
}
// FCN here is observed daily (not monthly), so "start of observation" is simply the
// 開始比價日 the person enters from the product's own documents (保證配息期 ends there).
function trackingStartOf(p) {
  const firstStepdownDate = (p.observationDates || []).map((item) => item.date).filter(Boolean).sort()[0];
  return p.startObsDate || firstStepdownDate || p.tradeDate || p.issueDate || newYorkTodayISO();
}
function historyFor(symbol, prices) {
  const normalized = normalizeSymbol(symbol);
  return prices[normalized] || prices[symbol] || {};
}
function splitEventsFor(symbol, prices) {
  const events = historyFor(symbol, prices)?.$splits;
  return Array.isArray(events) ? events.filter((event) => /^\d{4}-\d{2}-\d{2}$/.test(event?.date || "") && Number(event?.numerator) > 0 && Number(event?.denominator) > 0) : [];
}
function relevantSplitsFor(p, u, prices, throughDate = "9999-12-31") {
  const baseDate = p.tradeDate || trackingStartOf(p);
  return splitEventsFor(u.symbol, prices).filter((event) => event.date > baseDate && event.date <= throughDate);
}
function splitFactorFor(p, u, date, prices) {
  return relevantSplitsFor(p, u, prices, date).reduce((factor, event) => factor * Number(event.numerator) / Number(event.denominator), 1);
}
function recordClose(value) {
  const price = typeof value === "object" && value !== null ? value.price ?? value.close : value;
  const number = Number(price);
  return Number.isFinite(number) ? number : null;
}
function isWeekendDate(date) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date || "")) return false;
  const day = new Date(`${date}T12:00:00Z`).getUTCDay();
  return day === 0 || day === 6;
}
function trustedCloseForDate(value, date, symbol = "") {
  const close = recordClose(value);
  if (close === null) return null;
  if (isWeekendDate(date)) return null;
  // A dated value cannot be an official close until that symbol's own market
  // has closed. Intl time zones handle US/Australian daylight saving changes.
  if (symbol && !isMarketCloseReadyForSymbol(symbol, date)) return null;
  const age = /^\d{4}-\d{2}-\d{2}$/.test(date || "") ? daysBetween(date, todayISO()) : 99;
  const isObject = typeof value === "object" && value !== null;
  if (isObject && value.manualClose === true) return close;
  // Quarantine records produced by the older quote function, which could mark
  // a pre-market daily candle as official. A refresh with the new function
  // replaces them with a versioned completed-close record.
  if (isObject && value.officialClose === true) {
    return value.closeVerification === "completed-daily-v3" ? close : null;
  }
  if (age >= 0 && age <= 2) return null;
  return close;
}
function recordHigh(value) {
  const price = typeof value === "object" && value !== null ? value.high ?? value.price ?? value.close : value;
  const number = Number(price);
  return Number.isFinite(number) ? number : null;
}
function comparableCloseFor(p, u, date, prices) {
  const close = trustedCloseForDate(historyFor(u.symbol, prices)[date], date, u.symbol);
  if (close === null) return null;
  return close * splitFactorFor(p, u, date, prices);
}
function latestPriceFor(symbol, prices) {
  const hist = historyFor(symbol, prices);
  if (!hist) return null;
  const dates = Object.keys(hist).filter((date) => /^\d{4}-\d{2}-\d{2}$/.test(date)).sort();
  if (dates.length === 0) return null;
  const trustedDates = dates.filter((date) => trustedCloseForDate(hist[date], date, symbol) !== null);
  if (trustedDates.length === 0) return null;
  const date = trustedDates[trustedDates.length - 1];
  const price = trustedCloseForDate(hist[date], date, symbol);
  return { date, price, high: recordHigh(hist[date]) };
}
function totalsByCurrency(p) {
  return (p.clients || []).reduce((totals, client) => {
    const currency = client.currency || p.currency || "USD";
    totals[currency] = (totals[currency] || 0) + (Number(client.amount) || 0);
    return totals;
  }, {});
}
// price levels implied by the entered percentages, per underlying — entry price × %
function levelsFor(p, u) {
  const entry = Number(u.entryPrice) || 0;
  return {
    ko: entry * (Number(p.autocallPct) || 0) / 100,
    strike: entry * (Number(p.strikePct) || 0) / 100,
    ki: entry * (Number(p.kiPct) || 0) / 100,
  };

function backupPdfText(portableCode) {
  const content = "BT\n/F1 20 Tf\n72 740 Td\n(FCN Backup) Tj\nET\n";
  const objects = [
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>",
    `<< /Length ${content.length} >>\nstream\n${content}endstream`,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
  ];
  let pdf = "%PDF-1.4\n";
  const offsets = [0];
  objects.forEach((body, index) => {
    offsets.push(pdf.length);
    pdf += `${index + 1} 0 obj\n${body}\nendobj\n`;
  });
  const wrappedBackup = portableCode.match(/.{1,96}/g).map((line) => `%${line}\n`).join("");

  const xrefOffset = pdf.length;
  pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
  for (let index = 1; index <= objects.length; index += 1) pdf += `${String(offsets[index]).padStart(10, "0")} 00000 n \n`;

async function decodeBackupInput(text) {
  const clean = String(text || "").replace(/^\uFEFF/, "").trim();
  const raw2Index = clean.toUpperCase().indexOf("FCNRAW2:");
  if (raw2Index >= 0) {
    const compact = clean.slice(raw2Index).replace(/[%\s\u200B-\u200D\uFEFF]+/g, "");
    const match = compact.match(/^FCNRAW2:(\d+):([0-9a-f]{8}):([A-Za-z0-9+/=]+)/i);
    if (!match) throw new Error("BACKUP_CODE_INCOMPLETE");
    const expectedLength = Number(match[1]);
    const expectedChecksum = match[2].toLowerCase();
    const payload = match[3].slice(0, expectedLength);
    if (payload.length !== expectedLength || backupChecksum(payload) !== expectedChecksum) throw new Error("BACKUP_CODE_INCOMPLETE");

}

    else if (activeFilter === "matured_shares") result = activeStatuses.filter((s) => s.status.key === "matured_shares");
    else if (activeFilter === "pending_docs") result = activeStatuses.filter((s) => s.status.key === "pending_docs");
    else if (activeFilter === "upcoming") result = activeStatuses.filter((s) => s.status.key === "live" && Number.isFinite(s.status.daysToMaturity) && s.status.daysToMaturity >= 0 && s.status.daysToMaturity <= 7)
      .sort((a,b) => a.status.daysToMaturity - b.status.daysToMaturity);
    else if (activeFilter === "month") result = activeStatuses.filter((s) => ["live", "matured_pending"].includes(s.status.key) && maturityOf(s.p).slice(0, 7) === expiryMonth)
      .sort((a, b) => maturityOf(a.p).localeCompare(maturityOf(b.p)));
    return result;
  }, [activeStatuses, activeFilter, expiryMonth]);
  const contextualOneLeftCount = useMemo(
    () => filteredByPrimary.filter((item) => isOneUnderlyingFromCall(item.status)).length,
    [filteredByPrimary]
  );
  const filteredStatuses = useMemo(
    () => oneLeftOnly ? filteredByPrimary.filter((item) => isOneUnderlyingFromCall(item.status)) : filteredByPrimary,
    [filteredByPrimary, oneLeftOnly]
  );

  const sortedStatuses = useMemo(() => {
    const searched = filteredStatuses.filter(({ p }) => FcnTools.productMatchesSearch(p, searchText));
    const rank = { pending_docs: 0, live: 1, called: 2, matured_par: 2, matured_shares: 2, matured_pending: 2 };
    return [...searched].sort((a, b) => {
      const ra = rank[a.status.key] ?? 2;
      const rb = rank[b.status.key] ?? 2;
      if (ra !== rb) return ra - rb;
      if (activeFilter === "upcoming" || activeFilter === "month") return maturityOf(a.p).localeCompare(maturityOf(b.p));
      return compareProductCode(a.p.code, b.p.code);
    });
  }, [filteredStatuses, activeFilter, searchText]);
  const filteredCopyText = useMemo(() => FcnTools.buildFilteredCopyText(sortedStatuses,
    (p) => p.documentStatus === "pending" ? (p.finalValuationDate || "") : maturityOf(p), structureLabel), [sortedStatuses]);

  const filterCard = (key) => ({
    onClick: () => key === "one_left" ? setOneLeftOnly((value) => !value) : setActiveFilter(activeFilter === key ? "all" : key),
    className: `rounded-xl border px-3 py-3 cursor-pointer transition ${(key === "one_left" ? oneLeftOnly : activeFilter === key) ? "ring-2 ring-amber-400" : "hover:border-slate-400"} ${toneClasses[key === "upcoming" || key === "month" || key === "pending_docs" || key === "one_left" ? "warning" : key === "matured_shares" ? "danger" : "success"]}`
  });

  const activeProductsByCustomer = useMemo(() => {
    const map = new Map();
    statuses.filter(({ status }) => ["live", "pending_docs"].includes(status.key)).forEach(({ p, status }) => {
      const seenNames = new Set();
      (p.clients || []).forEach((client) => {
        const key = normalizedCustomerName(client.name);
        if (!key || seenNames.has(key)) return;
        seenNames.add(key);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push({ id: p.id, code: p.code || "未命名產品", structure: structureLabel(p), maturity: status.key === "live" ? maturityOf(p) : "" });
      });
    });
    map.forEach((items) => items.sort((a, b) => compareProductCode(a.code, b.code)));
    return map;
  }, [statuses]);
  const visibleCustomers = useMemo(() => {
    const query = customerSearch.trim().toLocaleLowerCase("zh-Hant");
    return customers
      .filter((customer) => !query || String(customer.name || "").toLocaleLowerCase("zh-Hant").includes(query))
      .map((customer) => ({ ...customer, activeProducts: activeProductsByCustomer.get(normalizedCustomerName(customer.name)) || [] }))
      .sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "zh-Hant"));
  }, [customers, customerSearch, activeProductsByCustomer]);
  const staffDirectory = useMemo(() => {
    const map = new Map();
    customers.forEach((customer) => {
      const name = String(customer.coSalesName || "").trim();
      if (name) map.set(name, { name, unit: String(customer.unit || "").trim() });
    });
    return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name, "zh-Hant"));
  }, [customers]);

  return (
    <div className="app-shell min-h-screen text-slate-200 font-body pb-28" style={{ paddingTop: "env(safe-area-inset-top)" }}>

        <div className="top-panel flex items-center justify-between gap-4 mb-4 px-4 sm:px-5 py-3.5">
          <div className="flex items-center gap-3 min-w-0">
            <img src="/icon-192.png" alt="" className="w-11 h-11 sm:w-12 sm:h-12 rounded-xl shrink-0 shadow-lg shadow-cyan-950/40" />
            <div>
              <h1 className="font-display text-2xl sm:text-3xl font-semibold tracking-tight text-white">
                {activePage === "products" ? "FCN記錄" : activePage === "customers" ? "客戶資料" : "已確認結案"}
              </h1>
              <div className="text-sm text-slate-400 mt-1 font-num">{fmtDate(todayISO())}</div>
            </div>
          </div>
          {activePage === "products" ? (
            <button onClick={refreshAllPrices} disabled={refreshing || allSymbols.length === 0}
              className="pencil-button flex items-center gap-2 bg-[#c0a87c] hover:bg-[#ccb88f] disabled:bg-slate-800 disabled:text-slate-500 text-slate-950 font-semibold px-3 py-2.5 rounded-xl shrink-0">
              <IRefresh className={refreshing ? "animate-spin" : ""} />
              <span className="mobile-action-label">今日更新</span>
            </button>
          ) : activePage === "customers" ? (
            <button onClick={() => { setEditingCustomer(emptyCustomerRecord()); setCustomerFormOpen(true); }}
              className="pencil-button flex items-center gap-2 bg-[#9eb09d] text-slate-950 font-semibold px-3 py-2.5 rounded-xl shrink-0">
              <IPlus /> 新增客戶
            </button>
          ) : (
            <div className="shrink-0 rounded-xl border border-slate-600 bg-slate-800/70 px-3 py-2 text-sm text-slate-200">
              <span className="font-num text-lg font-semibold">{archivedStatuses.length}</span> 檔
            </div>
          )}
        </div>

        {activePage === "products" ? <>
        <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 mb-3">
          <DashCard label="待補最終文件" count={buckets.pendingDocs.length} tone="warning" icon={IClock} {...filterCard("pending_docs")} />
          <DashCard label="提前出場" count={buckets.called.length} tone="success" icon={ICheck} {...filterCard("called")} />
          <DashCard label="到期保本" count={buckets.maturedPar.length} tone="success" icon={ICheck} {...filterCard("matured_par")} />
          <DashCard label="到期接股票" count={buckets.maturedShares.length} tone="danger" icon={IX2} {...filterCard("matured_shares")} />
          <DashCard label="7天內到期" count={buckets.upcoming.length} tone="warning" icon={IClock} {...filterCard("upcoming")} />
          <DashCard label={`${expiryMonth.replace("-", "/")}到期`} count={buckets.month.length} tone="warning" icon={IClock} {...filterCard("month")} />
          <DashCard label={activeFilter === "month" ? "本月只差1檔" : "只差1檔出場"} count={contextualOneLeftCount} tone="warning" icon={IWarn} {...filterCard("one_left")} />
        </div>

        <label className="flex flex-wrap items-center gap-2.5 mb-4 text-sm text-slate-300">
          <span className="shrink-0">到期月份</span>
          <input type="month" value={expiryMonth} onChange={(e) => setExpiryMonth(e.target.value)}
            className="bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-slate-100 font-num" />
        </label>

        {(activeFilter !== "all" || oneLeftOnly) && (
          <div className="flex items-center justify-between mb-4 px-3 py-2 rounded-lg bg-slate-900 border border-slate-600 text-sm text-slate-300">
            <span>已套用篩選{oneLeftOnly && activeFilter !== "all" ? "（雙重條件）" : ""}；再點同一張卡可取消</span>
            <button onClick={() => { setActiveFilter("all"); setOneLeftOnly(false); }} className="text-amber-500 hover:text-amber-400">清除全部篩選</button>
          </div>

        <div className="utility-panel flex flex-wrap items-center justify-between gap-x-3 gap-y-1 mb-4 rounded-xl px-3.5 py-2.5">

            <IPlus /> 新增產品

          <button onClick={() => setBonusModalOpen(true)} className="flex items-center gap-1.5 text-slate-300 hover:text-slate-100 text-sm">▤ 獎金計算</button>
          <button onClick={() => setBackupModalOpen(true)} className="flex items-center gap-1.5 text-slate-300 hover:text-slate-100 text-sm">
            <IArchive /> 備份與還原
          </button>
        </div>

        <label className="block mb-5">
          <div className="text-sm text-slate-300 mb-2">搜尋產品代號／幣別</div>
          <div className="relative">
            <input value={searchText} onChange={(e) => setSearchText(e.target.value)} placeholder="例如：2026SN1111、JPY、TWD"
              className="w-full bg-slate-900/80 border border-slate-600 rounded-xl pl-4 pr-12 py-3 text-slate-50 font-num placeholder:text-slate-500 shadow-inner" />
            {searchText && <button type="button" aria-label="清除產品搜尋" onClick={() => setSearchText("")}
              className="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 min-h-0 rounded-lg text-slate-300 hover:bg-white/10"><IX2 /></button>}
          </div>
        </label>
        <div className="mb-4 flex items-center justify-between gap-3 text-sm">
          <span className="text-slate-300">目前 {sortedStatuses.length} 檔商品</span>
          <button type="button" disabled={!filteredCopyText} onClick={() => copyTextResult(filteredCopyText, "篩選清單")}
            className="pencil-button rounded-lg px-3 py-1.5 text-slate-100 disabled:opacity-40">複製篩選清單</button>
        </div>

        <div className="pm-panel mb-6 rounded-2xl p-4 sm:p-5">
          <div className="flex items-center justify-between gap-3 mb-2">
            <div>
              <div className="text-lg font-semibold text-slate-50">比對清單</div>
            </div>
            {pmReportText && <button onClick={() => setPmReportText("")} className="shrink-0 text-sm text-cyan-300 hover:text-cyan-200">清除</button>}
          </div>
          <textarea value={pmReportText} onChange={(e) => setPmReportText(e.target.value)} rows="5"
            placeholder={"貼上 PM 清單或備忘錄清單\n2026SN4253 提前到期\n@2026SN4068（FCN）終比價（11/20到期）"}

          {pmComparison && (
            <div className="mt-4 space-y-3">

                <PmCount label="客戶商品" count={pmComparison.overlaps.length} tone="neutral" />
                <PmCount label="系統一致" count={pmComparison.consistent.length} tone="success" />
                <PmCount label="需要確認" count={pmComparison.mismatches.length} tone="danger" />
              </div>

              {pmComparison.mismatches.length > 0 && (
                <PmResultGroup title="請確認：PM 與系統判定不同" tone="danger"
                  rows={pmComparison.mismatches.map((item) => `${item.code}｜PM：${item.label}；系統：${item.status.label}`)} />
              )}
              {pmComparison.consistent.length > 0 && (
                <PmResultGroup title="PM 與系統一致" tone="success"
                  rows={pmComparison.consistent.map((item) => `${item.code}｜${item.label}`)} />

              {pmCopyText && (
                <div className="rounded-xl border border-cyan-800 bg-cyan-950/30 p-3.5">
                  <div className="flex items-center justify-between gap-3 mb-2">
                    <div className="font-medium text-cyan-100">今日主管回報格式</div>
                    <button type="button" onClick={copyPmResult}
                      className="pencil-button shrink-0 rounded-lg bg-[#9eb5bc] px-3 py-1.5 text-sm font-semibold text-slate-950">
                      一鍵複製
                    </button>
                  </div>
                  <pre className="whitespace-pre-wrap break-words rounded-lg bg-slate-950/70 px-3 py-2.5 text-sm leading-relaxed text-slate-100 font-body">{pmCopyText}</pre>
                </div>
              )}
              {pmComparison.overlaps.length === 0 && (
                <div className="rounded-xl border border-slate-700 bg-slate-950/60 px-4 py-3 text-sm text-slate-300">這份 PM 清單沒有與妳目前的客戶商品重複。</div>
              )}
              {pmComparison.ignoredCount > 0 && (
                <div className="text-sm text-slate-400">已略過 {pmComparison.ignoredCount} 筆不在妳客戶名單內的商品。</div>
              )}
            </div>
          )}

          {memoComparison && (
            <div className="mt-4 space-y-3">
              {memoComparison.memoEntries.length === 0 ? (
                <div className="rounded-xl border border-rose-700 bg-rose-950/40 px-4 py-3 text-sm text-rose-100">找不到商品代號。</div>
              ) : (
                <>
                  {memoComparison.removeAt.length > 0 && (
                    <PmResultGroup title="已結案，請移除 @" tone="danger"
                      rows={memoComparison.removeAt.map((item) => `${item.code}｜${item.status.label}`)} />
                  )}
                  {memoComparison.closedMemoButOpen.length > 0 && (
                    <PmResultGroup title="備忘錄已結案，系統仍未結案" tone="danger"
                      rows={memoComparison.closedMemoButOpen.map((item) => `${item.code}｜${item.status.label}`)} />
                  )}
                  {memoComparison.openMissingFromTracker.length > 0 && (
                    <PmResultGroup title="備忘錄有 @，記錄台找不到" tone="danger"
                      rows={memoComparison.openMissingFromTracker.map((item) => item.code)} />
                  )}
                  {memoComparison.activeMissingFromMemo.length > 0 && (
                    <PmResultGroup title="未結案，但備忘錄未記錄" tone="danger"
                      rows={memoComparison.activeMissingFromMemo.map((item) => `${normalizeProductCode(item.p.code)}｜${item.status.label}`)} />
                  )}
                  {memoComparison.removeAt.length === 0 && memoComparison.closedMemoButOpen.length === 0 && memoComparison.openMissingFromTracker.length === 0 && memoComparison.activeMissingFromMemo.length === 0 && (
                    <PmResultGroup title="比對一致" tone="success" rows={[`${memoComparison.memoEntries.length} 檔商品`]} />
                  )}
                </>
              )}
            </div>
          )}
        </div>

        <div className="space-y-2.5">
          {sortedStatuses.length === 0 && (
            <div className="text-center text-slate-400 py-16 border border-dashed border-slate-600 rounded-xl">
              {searchText || activeFilter !== "all" || oneLeftOnly ? "沒有符合目前搜尋或篩選條件的商品" : "還沒有產品，點上面「新增產品」開始記錄"}
            </div>
          )}
          {sortedStatuses.map(({ p, status }) => (
            <div id={productDomId(p.id)} key={p.id} className="product-card border rounded-2xl overflow-hidden scroll-mt-4">
              <div className="flex flex-col gap-2.5 px-3.5 py-3 cursor-pointer sm:flex-row sm:items-center sm:justify-between"
                onClick={() => setExpanded((e) => ({ ...e, [p.id]: !e[p.id] }))}>
                <div className="w-full min-w-0 sm:w-auto">
                  <div className="font-medium text-lg sm:text-xl text-slate-50 break-words font-num">{p.code || "未命名產品"}</div>
                  <div className="text-sm text-slate-400 break-words mt-0.5">
                    {structureLabel(p)} ・ {(p.clients || []).map((c) => c.name).filter(Boolean).join("、") || "—"}
                  </div>
                </div>
                <div className="flex w-full flex-wrap items-center gap-2 sm:w-auto sm:justify-end">
                  <span className={`px-2.5 py-1 rounded-full text-sm border font-medium ${toneClasses[status.tone]}`}>{status.label}</span>
                  {p.completionConfirmed && (
                    <span className="px-2.5 py-1.5 rounded-full text-xs border border-slate-600 bg-slate-800 text-slate-300">已確認結案</span>
                  )}
                  {productSplitNotices(p, prices).length > 0 && (
                    <span className="px-2.5 py-1.5 rounded-full text-xs border border-cyan-700 bg-cyan-950 text-cyan-200">拆股已換算</span>
                  )}
                  {status.key === "live" && <span className="text-sm text-slate-400 font-num hidden sm:inline">{status.daysToMaturity}天後到期</span>}
                  <span className="ml-auto sm:ml-0">{expanded[p.id] ? <IChevUp className="text-slate-500" /> : <IChevDown className="text-slate-500" />}</span>
                </div>
              </div>

              {expanded[p.id] && (
                <div className="px-3.5 pb-4 border-t border-slate-700 pt-3.5 text-base">
                  {status.key === "pending_docs" && (
                    <div className="mb-4 rounded-xl border border-amber-700 bg-amber-950/40 px-4 py-3 text-amber-100">
                      <div className="font-medium">等待最終文件</div>
                      <div className="text-sm text-amber-200/80 mt-1">文件收到後按下方「編輯」，切換成「最終文件已收到」並補齊條款。</div>
                    </div>
                  )}
                  <div className="mb-3">
                    <div className="text-sm text-slate-400 mb-1.5">客戶與投入金額</div>
                    <div className="space-y-1">
                      {(p.clients || []).map((c) => (
                        <div key={c.id} className="flex justify-between font-num text-sm bg-slate-950/60 rounded-lg px-3 py-2">
                          <span className="text-slate-300 font-body">{c.name || "—"}</span>
                          <span className="text-slate-300">{c.amount ? Number(c.amount).toLocaleString() : "—"} {c.currency || p.currency}</span>
                        </div>
                      ))}
                      <div className="flex justify-between text-sm px-3 pt-1 text-slate-400">
                        <span>分幣別合計</span>
                        <span className="font-num text-right">{Object.entries(totalsByCurrency(p)).map(([currency, amount]) => `${amount.toLocaleString()} ${currency}`).join(" / ") || "—"}</span>
                      </div>
                    </div>
                  </div>

                  {status.key !== "pending_docs" && <>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-4 text-base">
                    <Field label="商品架構" value={structureLabel(p)} />
                    <Field label="出場模式" value={isStepdown(p) ? (stepdownModeOf(p) === "period_end_memory" ? "Period End Memory" : "Period End") : (fcnModeOf(p) === "daily_memory" ? "Daily Memory" : "Daily")} />
                    <Field label="商品幣別" value={p.currency || "USD"} />
                    <Field label="交易日" value={fmtDate(p.tradeDate)} />
                    <Field label="開始比價日" value={p.startObsDate ? fmtDate(p.startObsDate) : (isStepdown(p) ? "見觀察日" : "—")} />
                    <Field label="期末評價日" value={fmtDate(maturityOf(p))} />
                    <Field label="年化配息" value={p.couponRate ? `${p.couponRate}%` : "—"} />
                    <Field label="保證領息" value={`${guaranteedCouponMonthsOf(p)} 個月`} />
                    <Field label="執行價" value={`${p.strikePct}%`} />
                    <Field label="出場價" value={`${p.autocallPct}%`} />
                    <Field label="期末判斷" value={kiTypeOf(p) === "NONE" ? `None／執行價 ${p.strikePct}%` : `${kiTypeOf(p)} ${p.kiPct}%`} />
                    {isStepdown(p) && <Field label="每月步階下降" value={`${p.stepDownPct || 0}%`} />}
                    {structureOf(p) === "EXPRESS_FCN" && <Field label="首月觀察結束" value={p.firstMonthObsEnd ? fmtDate(p.firstMonthObsEnd) : "—"} />}
                  </div>

                  {isStepdown(p) && (
                    <div className="mb-4 rounded-xl border border-slate-700 bg-slate-950/50 p-3">
                      <div className="text-base text-slate-100 mb-2">Stepdown 每月觀察日（各市場正式收盤）</div>
                      <div className="grid gap-2 sm:grid-cols-2">
                        {observationSchedule(p).map((obs) => {
                          const check = status.koProgress?.checks?.find((item) => item.index === obs.index);
                          return <div key={obs.id} className={`flex items-center justify-between rounded-lg border px-3 py-2 text-sm ${check?.complete ? "border-emerald-500 bg-emerald-950/70" : check ? "border-amber-500 bg-amber-950/60" : "border-slate-700 bg-slate-900"}`}>
                            <span>第 {obs.monthNumber} 月・{obs.date ? fmtDate(obs.date) : "未填日期"}</span>
                            <span className={`font-semibold ${check?.complete ? "text-emerald-200" : "text-amber-200"}`}>{obs.thresholdPct}% {check ? (check.complete ? "✓ 已達 KO" : "○ 未達 KO") : ""}</span>

                        const splitFactor = lp ? splitFactorFor(p, u, lp.date, prices) : 1;
                        const splitEvents = relevantSplitsFor(p, u, prices, lp?.date || "9999-12-31");
                        const koHit = status.koProgress?.hits?.[underlyingIndex] || (isDailyStructure(p) ? koHitForUnderlying(p, u, prices) : null);

function SmallModal({ title, onClose, children }) {
  const panelRef = React.useRef(null), previousFocus = React.useRef(document.activeElement);
  const closeRef = React.useRef(onClose); closeRef.current = onClose;
  useEffect(() => {
    const panel = panelRef.current, previousOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const focusable = () => [...panel.querySelectorAll('button:not([disabled]), input, textarea, select, [tabindex="0"]')];
    const first = panel.querySelector("input") || focusable()[0]; first?.focus();
    const keydown = (event) => {
      if (event.key === "Escape") { event.preventDefault(); closeRef.current(); }
      if (event.key !== "Tab") return;
      const items = focusable();
      if (!items.length) { event.preventDefault(); return; }
      if (event.shiftKey && document.activeElement === items[0]) { event.preventDefault(); items.at(-1).focus(); }
      else if (!event.shiftKey && document.activeElement === items.at(-1)) { event.preventDefault(); items[0].focus(); }
    };
    document.addEventListener("keydown", keydown);
    return () => { document.removeEventListener("keydown", keydown); document.body.style.overflow = previousOverflow; previousFocus.current?.focus?.(); };
  }, []);
  return <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/55 p-4" onClick={onClose}>
    <section ref={panelRef} role="dialog" aria-modal="true" aria-label={title} className="modal-paper w-full max-w-sm max-h-[85vh] overflow-y-auto rounded-2xl p-4" onClick={(event) => event.stopPropagation()}>
      <div className="mb-4 flex items-center justify-between gap-3"><h2 className="font-display text-xl text-slate-50">{title}</h2>
        <button type="button" aria-label="關閉" onClick={onClose} className="h-9 w-9 min-h-0 rounded-lg text-slate-300 hover:bg-white/10"><IX2 /></button></div>
      {children}
    </section>
  </div>;
}

            className="w-full rounded-xl border border-slate-600 bg-slate-900 px-3.5 py-2.5 pr-11 text-slate-50" />
          {searchText && <button type="button" aria-label="清除客戶搜尋" onClick={() => onSearch("")}
            className="absolute right-1.5 top-1/2 h-9 w-9 min-h-0 -translate-y-1/2 rounded-lg text-slate-300 hover:bg-white/10"><IX2 /></button>}

        {customers.length === 0 && (
          <div className="rounded-2xl border border-dashed border-slate-600 py-16 text-center text-slate-300">
            {searchText ? "沒有符合條件的客戶" : "商品資料中尚未找到客戶姓名"}
          </div>
        )}
        {customers.map((customer) => (
          <article key={customer.id} className="product-card rounded-2xl border p-3.5 sm:p-4">
            <div className="flex items-start justify-between gap-3">
              <h2 className="min-w-0 break-words text-lg font-semibold text-slate-50">{customer.name || "未命名客戶"}</h2>
              <button type="button" onClick={() => onEdit(customer)} className="flex shrink-0 items-center gap-1 text-sm text-slate-300"><IPencil />編輯</button>
            </div>
            <div className="mt-3 grid grid-cols-2 gap-2 text-sm">
              <div className="rounded-xl bg-[#2f3a3e] px-3 py-2.5">
                <div className="text-slate-400">共銷人員</div>
                <div className="mt-0.5 break-words text-slate-100">{customer.coSalesName || "—"}</div>
              </div>
              <div className="rounded-xl bg-[#2f3a3e] px-3 py-2.5">
                <div className="text-slate-400">單位</div>
                <div className="mt-0.5 break-words text-slate-100">{customer.unit || "—"}</div>
              </div>
            </div>
            <div className="mt-3 text-sm text-slate-400">交易權限</div>
            <div className="mt-3 flex flex-wrap gap-1.5">
              {(customer.permissions || []).length > 0 ? customer.permissions.map((permission) => (
                <span key={permission} className="rounded-full border border-[#93a493] bg-[#53645b] px-2.5 py-1 text-xs text-[#edf1e8]">{permissionLabel(permission)}</span>
              )) : <span className="text-sm text-slate-400">尚未設定交易權限</span>}
            </div>
            <div className="mt-4 border-t border-slate-700 pt-3">
              <div className="mb-2 flex items-center justify-between gap-2 text-sm">
                <span className="text-slate-300">存續中商品</span>
                <span className="rounded-full bg-[#536468] px-2.5 py-0.5 font-num text-slate-100">{customer.activeProducts.length}</span>
              </div>
              {customer.activeProducts.length > 0 ? (
                <div className="space-y-1.5">
                  {customer.activeProducts.map((product) => (
                    <button type="button" key={product.id} onClick={() => onOpenProduct(product.id)}
                      className="flex w-full flex-wrap items-center justify-between gap-x-3 gap-y-1 rounded-lg bg-[#2f3a3e] px-3 py-2 text-left text-sm transition hover:bg-[#3a484c] focus:outline-none focus:ring-2 focus:ring-[#9eb09d]">
                      <span className="font-num font-medium text-[#d8e5dc] underline decoration-[#7f9788] underline-offset-4">{product.code}</span>
                      <span className="text-slate-400">{product.structure}{product.maturity ? `・${fmtDate(product.maturity)}` : ""}　→</span>
                    </button>
                  ))}
                </div>
              ) : <div className="text-sm text-slate-400">目前沒有存續中商品</div>}
            </div>
            {customer.notes && (
              <div className="mt-3 rounded-xl border border-slate-700 bg-[#344044] px-3 py-2.5 text-sm text-slate-300">
                <span className="text-slate-400">備註：</span>{customer.notes}
              </div>
            )}
          </article>
        ))}
      </div>
    </div>
  );
}

function CustomerForm({ customer, staffDirectory, onCancel, onSave }) {
  const [record, setRecord] = useState(() => ({ ...emptyCustomerRecord(), ...customer, permissions: customer.permissions || [] }));
  const update = (key, value) => setRecord((previous) => ({ ...previous, [key]: value }));
  const updateCoSales = (value) => setRecord((previous) => {
    const match = staffDirectory.find((staff) => staff.name === value);
    return { ...previous, coSalesName: value, unit: match ? match.unit : previous.unit };
  });
  const togglePermission = (key) => setRecord((previous) => ({
    ...previous,
    permissions: previous.permissions.includes(key) ? previous.permissions.filter((item) => item !== key) : [...previous.permissions, key],
  }));
  return (
    <div className="fixed inset-0 z-[60] flex items-end justify-center bg-black/60 p-3 sm:items-center" onClick={onCancel}>
      <div className="modal-paper max-h-[92vh] w-full max-w-lg overflow-y-auto rounded-2xl" onClick={(event) => event.stopPropagation()}>
        <div className="sticky top-0 z-10 flex items-center justify-between border-b border-slate-700 bg-[#3b484c] px-4 py-3.5">
          <div className="font-display text-xl text-slate-50">{customer.name ? "編輯客戶" : "新增客戶"}</div>
          <button type="button" aria-label="關閉" onClick={onCancel} className="h-9 w-9 min-h-0 rounded-lg text-slate-300"><IX2 /></button>
        </div>
        <div className="space-y-4 p-4">
          <TextInput label="客戶姓名" value={record.name} onChange={(value) => update("name", value)} />
          <div>
            <div className="mb-2 text-sm text-slate-300">交易權限</div>
            <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
              {CUSTOMER_PERMISSIONS.map(([key, label]) => (
                <label key={key} className={`flex cursor-pointer items-center gap-2 rounded-xl border px-3 py-2.5 ${record.permissions.includes(key) ? "border-[#aebeaa] bg-[#53645b]" : "border-slate-600 bg-[#303a3e]"}`}>
                  <input type="checkbox" checked={record.permissions.includes(key)} onChange={() => togglePermission(key)} />
                  <span>{label}</span>
                </label>
              ))}
            </div>
          </div>
          <Row2>
            <label className="block">
              <div className="mb-1 text-sm text-slate-400">共銷人員</div>
              <input list="co-sales-directory" value={record.coSalesName} onChange={(event) => updateCoSales(event.target.value)}
                className="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2.5 text-base text-slate-100" />
              <datalist id="co-sales-directory">{staffDirectory.map((staff) => <option key={staff.name} value={staff.name}>{staff.unit}</option>)}</datalist>
            </label>
            <label className="block">
              <div className="mb-1 text-sm text-slate-400">單位</div>
              <input list="unit-directory" value={record.unit} onChange={(event) => update("unit", event.target.value)}
                className="w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2.5 text-base text-slate-100" />
              <datalist id="unit-directory">{Array.from(new Set(staffDirectory.map((staff) => staff.unit).filter(Boolean))).map((unit) => <option key={unit} value={unit} />)}</datalist>
            </label>
          </Row2>
          <label className="block">
            <div className="mb-1 text-sm text-slate-400">備註</div>
            <textarea value={record.notes} onChange={(event) => update("notes", event.target.value)} rows="3"
              className="w-full resize-y rounded-lg border border-slate-600 bg-slate-950 px-3 py-2.5 text-base text-slate-100" />
          </label>
        </div>
        <div className="sticky bottom-0 flex gap-2 border-t border-slate-700 bg-[#3b484c] px-4 py-3.5">
          <button type="button" onClick={onCancel} className="flex-1 rounded-xl border border-slate-600 py-2.5 text-slate-300">取消</button>
          <button type="button" disabled={!record.name.trim()} onClick={() => onSave(record)}
            className="flex-1 rounded-xl bg-[#c0a87c] py-2.5 font-semibold text-slate-950 disabled:bg-slate-800 disabled:text-slate-500">儲存</button>
        </div>
      </div>
    </div>
  );
}

function ProductForm({ product, onCancel, onSave }) {
  const [p, setP] = useState(() => {
    const tenor = Math.min(12, Math.max(2, Number(product.tenorMonths) || 6));
    const existingObservations = product.observationDates || [];
    const allowedStructure = STRUCTURES.some(([key]) => key === (product.structure || "FCN")) ? (product.structure || "FCN") : "FCN";
    return {
      ...product,
      structure: allowedStructure,
      documentStatus: product.documentStatus || ((product.underlyings || []).some((u) => u.symbol) ? "complete" : "pending"),
      clients: (product.clients || [emptyClient(product.currency || "USD")]).map((client) => ({ ...client, currency: client.currency || product.currency || "USD" })),
      underlyings: product.underlyings || [emptyUnderlying()],
      hasKi: kiTypeOf(product) !== "NONE",
      kiType: kiTypeOf(product),
      tenorMonths: tenor,
      guaranteedCouponMonths: guaranteedCouponMonthsOf(product),
      observationDates: Array.from({ length: tenor }, (_, index) => existingObservations[index] || { id: uid(), date: "" }),
    };
  });
  const update = (k, v) => setP((prev) => ({ ...prev, [k]: v }));

  const updateClient = (id, k, v) => setP((prev) => ({ ...prev, clients: prev.clients.map((c) => (c.id === id ? { ...c, [k]: v } : c)) }));
  const addClient = () => setP((prev) => ({ ...prev, clients: [...prev.clients, emptyClient(prev.currency || "USD")] }));
  const removeClient = (id) => setP((prev) => ({ ...prev, clients: prev.clients.filter((c) => c.id !== id) }));

  const updateUnderlying = (id, k, v) => setP((prev) => ({ ...prev, underlyings: prev.underlyings.map((u) => (u.id === id ? { ...u, [k]: v } : u)) }));
  const addUnderlying = () => setP((prev) => ({ ...prev, underlyings: [...prev.underlyings, emptyUnderlying()] }));
  const removeUnderlying = (id) => setP((prev) => ({ ...prev, underlyings: prev.underlyings.filter((u) => u.id !== id) }));
  const updateTenor = (value) => setP((prev) => {
    const tenor = Math.min(12, Math.max(2, Number(value) || 2));
    const current = prev.observationDates || [];
    return { ...prev, tenorMonths: tenor, observationDates: Array.from({ length: tenor }, (_, index) => current[index] || { id: uid(), date: "" }) };
  });
  const updateObservation = (index, date) => setP((prev) => ({
    ...prev,
    observationDates: prev.observationDates.map((obs, obsIndex) => obsIndex === index ? { ...obs, date } : obs),
  }));

  const basicReady = p.code && p.clients.length > 0 && p.clients.every((c) => c.name && c.amount && c.currency);
  const fullReady = basicReady
    && p.finalValuationDate
    && (p.underlyings || []).length > 0
    && p.underlyings.every((u) => u.symbol && u.entryPrice)
    && (isStepdown(p) ? observationSchedule(p).every((obs) => obs.date) : p.startObsDate)
    && (structureOf(p) !== "EXPRESS_FCN" || p.firstMonthObsEnd);
  const canSave = p.documentStatus === "pending" ? basicReady : fullReady;

  return (
    <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
      <div className="modal-paper rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-800 sticky top-0 bg-[#3b484c] z-10">
          <div className="font-display text-lg text-slate-100 italic">{product.code ? "編輯產品" : "新增產品"}</div>
          <button onClick={onCancel}><IX2 size={18} className="text-slate-500" /></button>
        </div>

        <div className="p-5 space-y-4 text-sm">
          <label className="block rounded-xl border border-amber-800 bg-amber-950/30 p-3">
            <div className="text-sm text-amber-100 mb-1.5">資料狀態</div>
            <select value={p.documentStatus} onChange={(e) => update("documentStatus", e.target.value)}
              className="w-full bg-slate-950 border border-amber-700 rounded-lg px-3 py-2.5 text-slate-100 text-base">
              <option value="pending">等待最終文件</option>
              <option value="complete">最終文件已收到</option>
            </select>
          </label>

          <Row2>
            <TextInput label="產品代號" value={p.code} onChange={(v) => update("code", v)} />
            <label className="block">
              <div className="text-sm text-slate-400 mb-1">商品幣別</div>
              <select value={p.currency} onChange={(e) => update("currency", e.target.value)}
                className="w-full bg-slate-950 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 text-base font-num">
                {CURRENCIES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </label>
          </Row2>

          <div>
            <div className="flex items-center justify-between mb-2">
              <div className="text-sm text-slate-300">客戶、投入金額與客戶使用幣別</div>
              <button onClick={addClient} className="text-sm text-amber-400 flex items-center gap-1"><IPlus size={14} />新增客戶</button>
            </div>
            <div className="space-y-2">
              {p.clients.map((c) => (
                <div key={c.id} className="grid grid-cols-12 gap-2 rounded-lg border border-slate-800 p-2">
                  <input placeholder="客戶姓名" value={c.name} onChange={(e) => updateClient(c.id, "name", e.target.value)}
                    className="col-span-12 sm:col-span-5 bg-slate-950 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 text-base" />
                  <input placeholder="投入金額" type="number" value={c.amount} onChange={(e) => updateClient(c.id, "amount", e.target.value)}
                    className="col-span-7 sm:col-span-4 bg-slate-950 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 text-base font-num" />
                  <select value={c.currency || p.currency} onChange={(e) => updateClient(c.id, "currency", e.target.value)}
                    className="col-span-4 sm:col-span-2 bg-slate-950 border border-slate-600 rounded-lg px-2 py-2.5 text-slate-100 text-base font-num">
                    {CURRENCIES.map((currency) => <option key={currency} value={currency}>{currency}</option>)}
                  </select>
                  {p.clients.length > 1 && <button onClick={() => removeClient(c.id)} className="col-span-1 text-rose-400"><ITrash size={16} /></button>}
                </div>
              ))}
            </div>
          </div>

          <TextInput label="交易日" type="date" value={p.tradeDate || ""} onChange={(v) => update("tradeDate", v)} />

          {p.documentStatus === "pending" && (
            <div className="rounded-xl border border-amber-800 bg-amber-950/30 px-4 py-3 text-sm text-amber-100">
              目前先存為「待補最終文件」。收到文件後再回來編輯，就能填商品架構、觀察日與連結標的。
            </div>
          )}

          {p.documentStatus === "complete" && <>
          <label className="block">
            <div className="text-sm text-slate-300 mb-1">產品架構</div>
            <select value={p.structure || "FCN"} onChange={(e) => update("structure", e.target.value)}
              className="w-full bg-slate-950 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 text-base">
              {STRUCTURES.map(([key, label]) => <option key={key} value={key}>{label}</option>)}
            </select>
          </label>

          {isDailyStructure(p) && (
            <label className="block bg-amber-950/30 border border-amber-800/70 rounded-xl p-3">
              <div className="text-base text-amber-100 mb-1">{structureLabel(p)} 出場模式</div>
              <select value={fcnModeOf(p)} onChange={(e) => update("fcnMode", e.target.value)}
                className="w-full bg-slate-950 border border-amber-700 rounded-lg px-3 py-2.5 text-slate-100 text-base">
                <option value="daily_memory">Daily Memory</option>
                <option value="daily">Daily</option>
              </select>
            </label>
          )}

          {isStepdown(p) && (
            <label className="block bg-amber-950/30 border border-amber-800/70 rounded-xl p-3">
              <div className="text-base text-amber-100 mb-1">Stepdown 出場模式</div>
              <select value={stepdownModeOf(p)} onChange={(e) => update("stepdownMode", e.target.value)}
                className="w-full bg-slate-950 border border-amber-700 rounded-lg px-3 py-2.5 text-slate-100 text-base">
                <option value="period_end">Period End</option>
                <option value="period_end_memory">Period End Memory</option>
              </select>
            </label>
          )}

          <Row2>
            <TextInput label="年化配息 %" type="number" value={p.couponRate || ""} onChange={(v) => update("couponRate", v)} />
            <label className="block">
              <div className="text-sm text-slate-400 mb-1">商品年限（月）</div>
              <select value={p.tenorMonths} onChange={(e) => updateTenor(e.target.value)}
                className="w-full bg-slate-950 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 text-base font-num">
                {Array.from({ length: 11 }, (_, index) => index + 2).map((month) => <option key={month} value={month}>{month} 個月</option>)}
              </select>
            </label>
          </Row2>

          <label className="block">
            <div className="text-sm text-slate-400 mb-1">保證領息月份</div>
            <select value={p.guaranteedCouponMonths} onChange={(e) => update("guaranteedCouponMonths", Number(e.target.value))}
              className="w-full bg-slate-950 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 text-base font-num">
              {Array.from({ length: 12 }, (_, index) => index + 1).map((month) => <option key={month} value={month}>{month} 個月</option>)}
            </select>
          </label>

          {!isStepdown(p) && (
            <TextInput label="開始比價日" type="date" value={p.startObsDate || ""} onChange={(v) => update("startObsDate", v)} />
          )}
          <TextInput label="期末評價日／到期日" type="date" value={p.finalValuationDate || ""} onChange={(v) => update("finalValuationDate", v)} />

          {structureOf(p) === "EXPRESS_FCN" && (
            <div className="space-y-2 rounded-xl border border-slate-700 p-3">
              <div className="text-sm text-slate-300">Express FCN 首月設定</div>
              <div className="text-sm text-slate-400">「開始比價日」請填發行日隔天；首月內達到上方提前出場條件時，狀態會標示為首月提前出場。</div>
              <TextInput label="第一個月觀察日結束" type="date" value={p.firstMonthObsEnd || ""} onChange={(v) => update("firstMonthObsEnd", v)} />
            </div>
          )}

          <Row2>
            <TextInput label="執行價 %" type="number" value={p.strikePct} onChange={(v) => update("strikePct", v)} />
            <TextInput label="提前出場 %" type="number" value={p.autocallPct} onChange={(v) => update("autocallPct", v)} />
          </Row2>

          {isStepdown(p) && <>
            <TextInput label="每月提前出場下降 %" type="number" value={p.stepDownPct || ""} onChange={(v) => update("stepDownPct", v)} />
            <div className="rounded-xl border border-slate-700 bg-slate-950/60 p-3">
              <div className="text-base text-slate-100">每月觀察日與提前出場門檻</div>
              <div className="text-sm text-slate-400 mt-1 mb-3">日期照最終文件輸入；門檻從保證領息月份接續下降。</div>
              <div className="space-y-2">
                {observationSchedule(p).map((obs) => (
                  <label key={obs.id} className="grid grid-cols-12 items-center gap-2 rounded-lg bg-slate-900 p-2">
                    <span className="col-span-3 text-sm text-slate-300">第 {obs.monthNumber} 月</span>
                    <input type="date" value={obs.date} onChange={(e) => updateObservation(obs.index, e.target.value)}
                      className="col-span-6 bg-slate-950 border border-slate-600 rounded-lg px-2 py-2 text-slate-100 text-sm font-num" />
                    <span className="col-span-3 text-right text-base text-amber-300 font-num">{obs.thresholdPct}%</span>
                  </label>
                ))}
              </div>
            </div>
          </>}

          <>
            <label className="block">
              <div className="text-sm text-slate-400 mb-1">KI 類型</div>
              <select value={kiTypeOf(p)} onChange={(e) => setP((prev) => ({ ...prev, kiType: e.target.value, kiTypeConfigured: true, hasKi: e.target.value !== "NONE" }))}
                className="w-full bg-slate-950 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 text-base">
                <option value="EKI">EKI</option>
                <option value="AKI">AKI</option>
                <option value="NONE">None</option>
              </select>
            </label>
            {kiTypeOf(p) !== "NONE" && <TextInput label={`${kiTypeOf(p)} %`} type="number" value={p.kiPct} onChange={(v) => update("kiPct", v)} />}
          </>

          <div>
            <div className="flex items-center justify-between mb-2">
              <div className="text-sm text-slate-300">連結標的</div>
              <button onClick={addUnderlying} className="text-sm text-amber-400 flex items-center gap-1"><IPlus size={14} />新增標的</button>
            </div>
            <div className="space-y-2">
              {p.underlyings.map((u) => (
                <div key={u.id} className="border border-slate-800 rounded-lg p-3 space-y-2">
                  <div className="flex gap-2">
                    <input placeholder="名稱（如 台積電ADR）" value={u.name} onChange={(e) => updateUnderlying(u.id, "name", e.target.value)}
                      className="flex-1 bg-slate-950 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 text-base" />
                    {p.underlyings.length > 1 && <button onClick={() => removeUnderlying(u.id)} className="text-rose-500"><ITrash size={14} /></button>}
                  </div>
                  <div className="flex gap-2">
                    <input placeholder="查價代碼（如 TSLA、8035JT 或 8035）" value={u.symbol} onChange={(e) => updateUnderlying(u.id, "symbol", e.target.value)}
                      className="flex-1 bg-slate-950 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 text-base font-num" />
                    <input placeholder="進場股價" type="number" value={u.entryPrice} onChange={(e) => updateUnderlying(u.id, "entryPrice", e.target.value)}
                      className="w-32 bg-slate-950 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 text-base font-num" />
                  </div>
                </div>
              ))}
            </div>
          </div>

          </>}

          <TextInput label="備註" value={p.notes || ""} onChange={(v) => update("notes", v)} />
        </div>

        <div className="flex gap-2 px-5 py-4 border-t border-slate-800 sticky bottom-0 bg-[#3b484c]">
          <button onClick={onCancel} className="flex-1 py-2.5 rounded-lg border border-slate-700 text-slate-400">取消</button>
          <button disabled={!canSave} onClick={() => onSave(p)}
            className="flex-1 py-2.5 rounded-lg bg-[#c0a87c] disabled:bg-slate-800 disabled:text-slate-600 text-slate-950 font-medium">儲存</button>
        </div>
      </div>
    </div>
  );
}

function Row2({ children }) { return <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">{children}</div>; }
function TextInput({ label, value, onChange, type = "text", placeholder, min, max, step }) {
  return (
    <label className="block">
      <div className="text-sm text-slate-400 mb-1">{label}</div>
      <input type={type} value={value} placeholder={placeholder} min={min} max={max} step={step} onChange={(e) => onChange(e.target.value)}
        className="w-full bg-slate-950 border border-slate-600 rounded-lg px-3 py-2.5 text-slate-100 text-base font-num" />
    </label>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
